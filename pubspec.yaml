name: abeni_mart
description: "Abeni Mart - Nigerian foodstuff retail and delivery app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # UI / UX
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  fluttertoast: ^8.2.8
  flutter_spinkit: ^5.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  equatable: ^2.0.5

  # Biometric authentication
  local_auth: ^2.3.0
  local_auth_android: ^1.0.43
  local_auth_darwin: ^1.4.2

  # Local notifications (used to surface FCM messages in foreground)
  flutter_local_notifications: ^17.2.3

  # Launch phone / email / WhatsApp links from contact screens
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/splash/
    - assets/icons/
