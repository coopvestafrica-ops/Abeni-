plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.abenimart.abeni_mart"
    // Pinned to 35 because several Flutter plugins (e.g.
    // flutter_plugin_android_lifecycle) now require compileSdk 35.
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Base application id; flavors below override or suffix this so the
        // customer and admin builds install side-by-side on the same device.
        applicationId = "com.abenimart.abeni_mart"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions += "app"
    productFlavors {
        customer {
            dimension = "app"
            applicationId = "com.abenimart.abeni_mart"
            resValue "string", "app_name", "Abeni Mart"
        }
        admin {
            dimension = "app"
            applicationId = "com.abenimart.abeni_admin"
            resValue "string", "app_name", "Abeni Admin"
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
