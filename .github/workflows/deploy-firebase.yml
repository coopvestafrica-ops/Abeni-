name: Deploy Firebase Rules & Functions

on:
  push:
    branches:
      - "devin/1776624013-abeni-mart"
      - "main"
      - "master"
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "functions/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Preflight: check that FIREBASE_TOKEN is configured ────────────
      - name: Check FIREBASE_TOKEN secret
        env:
          HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║          FIREBASE_TOKEN secret is NOT configured             ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║                                                              ║"
            echo "║  HOW TO FIX (one-time setup, takes ~2 minutes):             ║"
            echo "║                                                              ║"
            echo "║  1. On your local machine, run:                              ║"
            echo "║       firebase login:ci                                      ║"
            echo "║     Copy the token it prints (starts with '1//0g...').       ║"
            echo "║                                                              ║"
            echo "║  2. Go to your GitHub repo:                                  ║"
            echo "║       https://github.com/coopvestafrica-ops/Abeni-           ║"
            echo "║     → Settings → Secrets and variables → Actions             ║"
            echo "║     → New repository secret                                  ║"
            echo "║       Name:  FIREBASE_TOKEN                                  ║"
            echo "║       Value: <paste the token from step 1>                   ║"
            echo "║                                                              ║"
            echo "║  3. Re-run this workflow (Actions → Re-run all jobs).        ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            exit 1
          fi
          echo "✓ FIREBASE_TOKEN secret is present. Proceeding with deployment."

      # ── Setup ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      # ── Deploy Firestore (works on Spark and Blaze plans) ─────────────
      - name: Deploy Firestore rules
        run: |
          firebase deploy --only firestore:rules \
            --project abeni-mart \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Firestore indexes
        run: |
          firebase deploy --only firestore:indexes \
            --project abeni-mart \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      # ── Deploy Cloud Functions (requires Blaze plan) ──────────────────
      - name: Deploy Cloud Functions
        id: deploy_functions
        continue-on-error: true
        run: |
          firebase deploy --only functions \
            --project abeni-mart \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Cloud Functions — explain if deploy failed
        if: steps.deploy_functions.outcome == 'failure'
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║       Cloud Functions deploy needs the Blaze plan            ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  Cloud Functions require Google APIs that Firebase only      ║"
          echo "║  enables on the Blaze (pay-as-you-go) billing plan.          ║"
          echo "║                                                              ║"
          echo "║  Firestore rules and indexes deployed successfully above.    ║"
          echo "║  Only Cloud Functions (push notifications) are affected.     ║"
          echo "║                                                              ║"
          echo "║  TO ENABLE CLOUD FUNCTIONS:                                  ║"
          echo "║    1. Upgrade to Blaze plan (free quota still applies —      ║"
          echo "║       you only pay if you exceed free limits):               ║"
          echo "║       https://console.firebase.google.com/project/abeni-mart/usage/details"
          echo "║                                                              ║"
          echo "║    2. Re-run this workflow after upgrading.                   ║"
          echo "║                                                              ║"
          echo "║  NOTE: The Blaze plan has a generous free tier:              ║"
          echo "║    • 2M function invocations/month free                      ║"
          echo "║    • 400K GB-seconds compute/month free                      ║"
          echo "║    A billing account is required but charges only apply      ║"
          echo "║    above the free limits.                                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

      # ── Summary ───────────────────────────────────────────────────────
      - name: Print deployment summary
        if: always()
        run: |
          echo ""
          RULES_STATUS="✓ deployed"
          INDEXES_STATUS="✓ deployed"
          if [ "${{ steps.deploy_functions.outcome }}" = "success" ]; then
            FN_STATUS="✓ deployed"
          else
            FN_STATUS="✗ skipped (upgrade Firebase project to Blaze plan)"
          fi
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  Firebase Deploy Summary                     ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Firestore rules   : $RULES_STATUS"
          echo "║  Firestore indexes : $INDEXES_STATUS"
          echo "║  Cloud Functions   : $FN_STATUS"
          echo "║                                                              ║"
          echo "║  Project console: https://console.firebase.google.com/       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
