name: Deploy Firebase Rules & Functions

on:
  push:
    branches:
      - "devin/1776624013-abeni-mart"
      - "main"
      - "master"
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "functions/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project abeni-mart --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project abeni-mart --token "${{ secrets.FIREBASE_TOKEN }}"
